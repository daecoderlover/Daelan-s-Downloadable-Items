name: Generate Permanent Keystore Base64

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate Keystore and Print Base64
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias daelan_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass daelan123 \
            -keypass daelan123 \
            -dname "CN=Daelan, OU=Dev, O=Daelan, L=Calauan, S=Laguna, C=PH"

          echo "=== COPY EVERYTHING BETWEEN THE LINES BELOW ==="
          base64 -w 0 release.keystore
          echo ""
          echo "=== END OF KEYSTORE BASE64 ==="
