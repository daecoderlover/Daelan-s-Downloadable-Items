name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name shown in Android App Info (e.g., 1.3.1)'
        required: true
        default: '1.3.1'
      version_code:
        description: 'Version Code integer (must increase every build, e.g., 5)'
        required: true
        default: '5'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova & Android Tools
        run: npm install -g cordova

      - name: Generate Native Android Wrapper Project
        run: |
          cordova create app_wrapper io.github.daecoderlover.daelansitems "Daelan's Downloads"
          cd app_wrapper
          
          # Configure config.xml to load your live GitHub Pages site directly
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="io.github.daecoderlover.daelansitems" version="${{ github.event.inputs.version_name }}" android-versionCode="${{ github.event.inputs.version_code }}" xmlns="http://w3.org" xmlns:android="http://android.com">
              <name>Daelan's Downloads</name>
              <description>Daelan's Downloadable Items App</description>
              <content src="https://github.io" />
              <access origin="*" />
              <allow-navigation href="*" />
              <preference name="Fullscreen" value="false" />
              <preference name="Orientation" value="default" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
          </widget>
          EOF

          cordova platform add android
          cordova build android --release

      - name: Sign APK with Valid v2/v3 Android Certificate
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          UNSIGNED_APK="app_wrapper/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="DaelansDownloads-aligned.apk"
          FINAL_APK="DaelansDownloads-v${{ github.event.inputs.version_name }}.apk"

          # Generate a valid Android keystore
          keytool -genkey -v -keystore release.keystore -alias daelan_key -keyalg RSA -keysize 2048 -validity 10000 -storepass daelan123 -keypass daelan123 -dname "CN=Daelan, OU=Dev, O=Daelan, L=SanPablo, S=Laguna, C=PH"

          # Align and sign so Android Package Installer never says "Invalid"
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:daelan123 --key-pass pass:daelan123 --out "$FINAL_APK" "$ALIGNED_APK"

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: DaelansDownloads-v${{ github.event.inputs.version_name }}
          path: DaelansDownloads-v${{ github.event.inputs.version_name }}.apk
