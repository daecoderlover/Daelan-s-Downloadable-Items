name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name shown in Android App Info (numbers only, e.g., 1.3.7)'
        required: true
        default: '1.4.8'
      version_code:
        description: 'Version Code integer (must increase every build, e.g., 12)'
        required: true
        default: '15'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Generate daelan-bot Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout Repository as daelan-bot
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Disable Cordova Native Splash Screen
        run: |
          cordova plugin rm cordova-plugin-splashscreen || true
          node -e '
            const fs = require("fs");
            let xml = fs.readFileSync("config.xml", "utf8");
            if (!xml.includes("SplashScreenDelay")) {
              xml = xml.replace("</widget>", "    <preference name=\"SplashScreenDelay\" value=\"0\" />\n    <preference name=\"AutoHideSplashScreen\" value=\"true\" />\n</widget>");
              fs.writeFileSync("config.xml", xml);
            }
          '
          
      - name: Create & Build Android Wrapper
        run: |
          CLEAN_VERSION=$(echo "${{ github.event.inputs.version_name }}" | grep -oE '[0-9]+(\.[0-9]+)*' | head -n 1)
          if [ -z "$CLEAN_VERSION" ]; then CLEAN_VERSION="1.3.7"; fi

          cordova create app_wrapper io.github.daecoderlover.daelansitems "DaelansDownloads"
          
          ICON_PATH=$(find . -maxdepth 3 -name "gem192.png" | head -n 1)
          if [ -n "$ICON_PATH" ]; then
            cp "$ICON_PATH" app_wrapper/icon.png
            ICON_TAG='<icon src="icon.png" />'
          else
            ICON_TAG=''
          fi

          cd app_wrapper

          cat << EOF > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="io.github.daecoderlover.daelansitems" version="${CLEAN_VERSION}" android-versionCode="${{ github.event.inputs.version_code }}" xmlns="http://w3.org" xmlns:android="http://android.com">
              <name>Daelan&apos;s Downloads</name>
              <description>Daelan&apos;s Downloadable Items App</description>
              <content src="https://daecoderlover.github.io/Daelan-s-Downloadable-Items/" />
              ${ICON_TAG}
              <access origin="*" />
              <allow-navigation href="https://daecoderlover.github.io/*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="Fullscreen" value="false" />
              <preference name="Orientation" value="default" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
          </widget>
          EOF

          cordova platform add android@13.0.0
          cordova build android --release -- --packageType=apk

      - name: Sign APK with Permanent Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app_wrapper/platforms/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          ALIGNED_APK="DaelansDownloads-aligned.apk"

          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          $BUILD_TOOLS/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "DaelansDownloads.apk" "$ALIGNED_APK"

      - name: Save DaelansDownloads.apk Directly into Repository as daelan-bot
        run: |
          rm -rf app_wrapper release.keystore DaelansDownloads-aligned.apk
          git config user.name "daelan-bot[bot]"
          git config user.email "5843671+daelan-bot[bot]@users.noreply.github.com"
          git add DaelansDownloads.apk
          git commit -m "Build DaelansDownloads.apk v${{ github.event.inputs.version_name }}" || exit 0
          git push

      - name: Announce APK Build Result via daelan-bot
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: workflow_run
          TARGET_BRANCH: ${{ github.ref_name }}
          WF_NAME: Build Native Android APK
          WF_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/workflows/bot_brain.py
   
