name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name shown in Android App Info (numbers only, e.g., 1.3.3)'
        required: true
        default: '1.3.3'
      version_code:
        description: 'Version Code integer (must increase every build, e.g., 7)'
        required: true
        default: '7'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create & Build Android Wrapper
        run: |
          CLEAN_VERSION=$(echo "${{ github.event.inputs.version_name }}" | grep -oE '[0-9]+(\.[0-9]+)*' | head -n 1)
          if [ -z "$CLEAN_VERSION" ]; then CLEAN_VERSION="1.3.3"; fi

          cordova create app_wrapper io.github.daecoderlover.daelansitems "DaelansDownloads"
          
          ICON_PATH=$(find . -maxdepth 3 -name "gem192.png" | head -n 1)
          if [ -n "$ICON_PATH" ]; then
            cp "$ICON_PATH" app_wrapper/icon.png
            ICON_TAG='<icon src="icon.png" />'
          else
            ICON_TAG=''
          fi

          cd app_wrapper

          cat << EOF > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="io.github.daecoderlover.daelansitems" version="${CLEAN_VERSION}" android-versionCode="${{ github.event.inputs.version_code }}" xmlns="http://w3.org" xmlns:android="http://android.com">
              <name>Daelan&apos;s Downloads</name>
              <description>Daelan&apos;s Downloadable Items App</description>
              <content src="https://github.io" />
              ${ICON_TAG}
              <access origin="*" />
              <allow-navigation href="*" />
              <preference name="Fullscreen" value="false" />
              <preference name="Orientation" value="default" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
          </widget>
          EOF

          cordova platform add android@13.0.0
          cordova build android --release -- --packageType=apk

      - name: Sign APK with Valid Android Certificate
        run: |
          CLEAN_VERSION=$(echo "${{ github.event.inputs.version_name }}" | grep -oE '[0-9]+(\.[0-9]+)*' | head -n 1)
          if [ -z "$CLEAN_VERSION" ]; then CLEAN_VERSION="1.3.3"; fi

          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app_wrapper/platforms/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          ALIGNED_APK="DaelansDownloads-aligned.apk"
          FINAL_APK="DaelansDownloads-v${CLEAN_VERSION}.apk"

          keytool -genkey -v -keystore release.keystore -alias daelan_key -keyalg RSA -keysize 2048 -validity 10000 -storepass daelan123 -keypass daelan123 -dname "CN=Daelan, OU=Dev, O=Daelan, L=Calauan, S=Laguna, C=PH"

          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:daelan123 --key-pass pass:daelan123 --out "$FINAL_APK" "$ALIGNED_APK"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_code }}
          name: Daelan's Downloads v${{ github.event.inputs.version_name }}
          files: DaelansDownloads-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
