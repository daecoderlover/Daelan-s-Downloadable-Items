name: daelan-bot Status & Custom Reporter

on:
  workflow_run:
    workflows: ["CodeQL", "build-app", "build-exe"] # Must match the 'name:' inside those .yml files
    types:
      - completed
    branches:
      - '**' # Runs on ALL branches possible

jobs:
  bot-announce:
    runs-on: ubuntu-latest
    steps:
      - name: Generate daelan-bot Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Build Dynamic Message
        id: msg
        env:
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_STATUS: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CUSTOM_TEXT: ${{ vars.BOT_CUSTOM_COMMENT }} # Optional custom override
        run: |
          if [ -n "$CUSTOM_TEXT" ]; then
            BODY="$CUSTOM_TEXT"
          elif [ "$WF_STATUS" == "success" ]; then
            BODY="✅ **$WF_NAME** passed on branch \`$BRANCH\`! [View Run]($RUN_URL)"
          elif [ "$WF_STATUS" == "failure" ]; then
            BODY="❌ **$WF_NAME** failed on branch \`$BRANCH\`. Check logs: [View Run]($RUN_URL)"
          else
            BODY="⚠️ **$WF_NAME** finished with status **$WF_STATUS** on branch \`$BRANCH\`. [View Run]($RUN_URL)"
          fi
          
          # Save multiline-safe output
          {
            echo "text<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Post to a specific Issue (Set TARGET_ISSUE_NUMBER in Repo Variables)
      - name: Post to Issue
        if: vars.TARGET_ISSUE_NUMBER != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BODY: ${{ steps.msg.outputs.text }}
        run: |
          gh issue comment "${{ vars.TARGET_ISSUE_NUMBER }}" \
            --repo "${{ github.repository }}" \
            --body "$BODY"

      # OR Post to a specific Discussion (Set TARGET_DISCUSSION_NUMBER in Repo Variables)
      - name: Post to Discussion
        if: vars.TARGET_DISCUSSION_NUMBER != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BODY: ${{ steps.msg.outputs.text }}
        run: |
          DISCUSSION_ID=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) {
                discussion(number: $num) { id }
              }
            }' \
            -f owner="${{ github.repository_owner }}" \
            -f repo="${{ github.event.repository.name }}" \
            -F num="${{ vars.TARGET_DISCUSSION_NUMBER }}" \
            --jq '.data.repository.discussion.id')

          gh api graphql -f query='
            mutation($id: ID!, $body: String!) {
              addDiscussionComment(input: {discussionId: $id, body: $body}) {
                comment { id }
              }
            }' \
            -f id="$DISCUSSION_ID" \
            -f body="$BODY"
