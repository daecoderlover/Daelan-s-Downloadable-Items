name: daelan-bot Controller

on:
  workflow_dispatch:
    inputs:
      branch_target:
        description: 'Branch Target'
        required: true
        type: choice
        options:
          - main
          - files_for_download
          - all branches
      target_type:
        description: 'Type'
        required: true
        type: choice
        options:
          - Issues
          - Discussions
          - Compare Branches
      thread_number:
        description: 'Issue or Discussion Number (e.g., 1)'
        required: true
        default: '1'
        type: string
      message:
        description: 'Message (Markdown supported)'
        required: true
        type: string
      attach_file:
        description: 'Attach File path in repo (e.g., dist/app.apk or leave blank)'
        required: false
        type: string
      save_to_config:
        description: 'Save this rule into config.xml?'
        required: true
        default: false
        type: boolean

  workflow_run:
    workflows: ["CodeQL", "build-app", "build-exe"]
    types: [completed]
    branches: ['**']

jobs:
  daelan-bot-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Generate daelan-bot Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository as daelan-bot
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Run Python Bot Brain
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ inputs.branch_target || github.event.workflow_run.head_branch || github.ref_name }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_STATUS: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          INPUT_TYPE: ${{ inputs.target_type }}
          INPUT_NUMBER: ${{ inputs.thread_number }}
          INPUT_MESSAGE: ${{ inputs.message }}
          INPUT_ATTACH: ${{ inputs.attach_file }}
          INPUT_SAVE: ${{ inputs.save_to_config }}
        run: python3 .github/scripts/bot_brain.py

      - name: Commit updated config.xml as daelan-bot
        if: inputs.save_to_config == true
        run: |
          git config user.name "daelan-bot[bot]"
          git config user.email "5843671+daelan-bot[bot]@://github.com"
          git add config.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(bot): update config.xml rules"
          git push
