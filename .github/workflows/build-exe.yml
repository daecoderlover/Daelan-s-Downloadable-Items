name: Build Native Windows EXE

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g., 1.3.4)'
        required: true
        default: '1.3.4'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create WebView2 Wrapper & Build EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.event.inputs.version_name }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.3.4" }

          New-Item -ItemType Directory -Force -Path "win_wrapper" | Out-Null

          # Convert gem512.png into a proper Windows .ico file for the EXE
          $iconFile = Get-ChildItem -Path . -Filter "gem512.png" -Recurse -Depth 3 | Select-Object -First 1
          $iconProperty = ""
          if ($iconFile) {
            Add-Type -AssemblyName System.Drawing
            $bmp = [System.Drawing.Bitmap]::FromFile($iconFile.FullName)
            $resized = New-Object System.Drawing.Bitmap($bmp, 256, 256)
            $ms = New-Object System.IO.MemoryStream
            $resized.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            $pngBytes = $ms.ToArray()

            $icoPath = Join-Path (Resolve-Path "win_wrapper") "app.ico"
            $fs = [System.IO.File]::Create($icoPath)
            $bw = New-Object System.IO.BinaryWriter($fs)
            $bw.Write([uint16]0)
            $bw.Write([uint16]1)
            $bw.Write([uint16]1)
            $bw.Write([byte]0)
            $bw.Write([byte]0)
            $bw.Write([byte]0)
            $bw.Write([byte]0)
            $bw.Write([uint16]1)
            $bw.Write([uint16]32)
            $bw.Write([uint32]$pngBytes.Length)
            $bw.Write([uint32]22)
            $bw.Write($pngBytes)
            $bw.Close()
            $fs.Close()
            $bmp.Dispose()
            $resized.Dispose()

            $iconProperty = "<ApplicationIcon>app.ico</ApplicationIcon>"
          }

          Set-Location "win_wrapper"

          # Create C# Project File (.csproj)
          $csproj = @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <AssemblyName>DaelansDownloads</AssemblyName>
              <Version>$version</Version>
              <AssemblyTitle>Daelan's Downloads</AssemblyTitle>
              <Product>Daelan's Downloads</Product>
              $iconProperty
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>false</SelfContained>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.Web.WebView2" Version="1.0.2903.40" />
            </ItemGroup>
          </Project>
          "@
          $csproj | Out-File -FilePath "DaelansDownloads.csproj" -Encoding utf8NoBOM

          # Create Program.cs with WebView2 pointing to your live GitHub Pages site
          $programCs = @"
          using System;
          using System.Drawing;
          using System.IO;
          using System.Windows.Forms;
          using Microsoft.Web.WebView2.WinForms;

          namespace DaelansDownloads
          {
              internal static class Program
              {
                  [STAThread]
                  static void Main()
                  {
                      ApplicationConfiguration.Initialize();
                      Application.Run(new MainForm());
                  }
              }

              public class MainForm : Form
              {
                  private readonly WebView2 webView;

                  public MainForm()
                  {
                      this.Text = "Daelan's Downloads";
                      this.Width = 1200;
                      this.Height = 800;
                      this.StartPosition = FormStartPosition.CenterScreen;

                      try
                      {
                          this.Icon = Icon.ExtractAssociatedIcon(Application.ExecutablePath);
                      }
                      catch { }

                      webView = new WebView2
                      {
                          Dock = DockStyle.Fill,
                          Source = new Uri("https://github.io")
                      };

                      this.Controls.Add(webView);
                  }
              }
          }
          "@
          $programCs | Out-File -FilePath "Program.cs" -Encoding utf8NoBOM

          dotnet publish -c Release -r win-x64 -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: Prepare EXE and Check Size
        id: prep_exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "win_wrapper\publish\DaelansDownloads.exe")) {
            throw "DaelansDownloads.exe was not found in win_wrapper\publish\"
          }

          Move-Item -Path "win_wrapper\publish\DaelansDownloads.exe" -Destination ".\DaelansDownloads.exe" -Force
          Remove-Item -Path "win_wrapper" -Recurse -Force

          $sizeMB = [math]::Round((Get-Item ".\DaelansDownloads.exe").Length / 1MB, 2)
          Write-Host "Built DaelansDownloads.exe size: $sizeMB MB"

          if ($sizeMB -lt 100) {
            "can_commit=true" >> $env:GITHUB_OUTPUT
          } else {
            "can_commit=false" >> $env:GITHUB_OUTPUT
            Write-Warning "EXE is $sizeMB MB (>= 100MB GitHub repo limit). Publishing to GitHub Releases instead."
          }

      - name: Save DaelansDownloads.exe Directly into Repository
        if: steps.prep_exe.outputs.can_commit == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f DaelansDownloads.exe

          $changes = git status --porcelain DaelansDownloads.exe
          if (-not [string]::IsNullOrWhiteSpace($changes)) {
            git commit -m "Build DaelansDownloads.exe v${{ github.event.inputs.version_name }}"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed" }

            git push
            if ($LASTEXITCODE -ne 0) { throw "git push failed" }
          } else {
            Write-Host "No changes to DaelansDownloads.exe to commit."
          }

      - name: Upload EXE to GitHub Release (Fallback if >= 100MB)
        if: steps.prep_exe.outputs.can_commit == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version_name }}"
          name: "Daelan's Downloads v${{ github.event.inputs.version_name }}"
          files: DaelansDownloads.exe
          make_latest: true
