<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preparing Download...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #ffffff;
      color: #4a4a4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .icon-box {
      width: 110px;
      height: 110px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .item-title {
      font-size: 16px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 18px;
      max-width: 280px;
    }
    .progress-track {
      width: 240px;
      height: 6px;
      background-color: #ececec;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background-color: #8e8e8e;
      border-radius: 999px;
      transition: width 0.2s ease-out;
    }
    .percent-text {
      font-size: 15px;
      font-weight: 600;
      color: #6e6e6e;
      margin-bottom: 6px;
    }
    .status-text {
      font-size: 13px;
      color: #9a9a9a;
    }
    .back-btn {
      margin-top: 28px;
      padding: 8px 18px;
      font-size: 13px;
      color: #666;
      background: #f3f3f3;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <div class="icon-box">
    <img id="platformImg" src="Daelan_0_web/assets/cordova.png" alt="Loading..." />
  </div>
  <div class="item-title" id="itemTitle">Preparing file...</div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="percent-text" id="percentText">0%</div>
  <div class="status-text" id="statusText">Connecting to download server...</div>

  <button class="back-btn" id="backBtn" onclick="window.location.href='index.html'">← Back to Downloads</button>

  <script src="script.js"></script>

  <script>
    const platformImg = document.getElementById("platformImg");
    if (navigator.userAgent.includes("Windows")) {
      platformImg.src = "Daelan_0_web/assets/webview.png";
    }

    const params = new URLSearchParams(window.location.search);
    const itemId = Number(params.get("id"));

    // Read 'items' directly from script.js
    const selectedItem = items.find(item => Number(item.id) === itemId);

    const titleEl = document.getElementById("itemTitle");
    const fill = document.getElementById("progressFill");
    const percentText = document.getElementById("percentText");
    const statusText = document.getElementById("statusText");
    const backBtn = document.getElementById("backBtn");

    if (!selectedItem) {
      titleEl.textContent = "Item Not Found";
      statusText.textContent = "Invalid download ID.";
      backBtn.style.display = "inline-block";
    } else {
      titleEl.textContent = selectedItem.title;
      const safeLinks = selectedItem.downloadLinks.filter(link => isFileSafe(link.name) && link.url);

      let progress = 0;
      const timer = setInterval(() => {
        if (progress < 90) {
          progress += Math.floor(Math.random() * 14) + 6;
          if (progress > 90) progress = 90;
          fill.style.width = progress + "%";
          percentText.textContent = progress + "%";
        }
      }, 180);

      setTimeout(() => {
        clearInterval(timer);
        fill.style.width = "100%";
        percentText.textContent = "100%";
        backBtn.style.display = "inline-block";

        if (safeLinks.length === 0) {
          statusText.textContent = "Download link coming soon.";
          return;
        }

        statusText.textContent = `Starting download (${safeLinks.length} file)...`;
        safeLinks.forEach(link => {
          const a = document.createElement("a");
          a.href = link.url;
          a.download = link.name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
if (/Android/i.test(navigator.userAgent)) {
  window.open(link.url, "_system");
} else {
  const a = document.createElement("a");
  a.href = link.url;
  a.download = link.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};
        });
      }, 1400);
    }
  </script>
</body>
</html>
