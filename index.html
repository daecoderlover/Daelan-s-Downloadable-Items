<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="og6FeBb6OchdvgFyNtK5Zou97V8IQocQrxjziH6Pafs" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Daelan's Downloadable Items</title>
    <link rel="stylesheet" href="style.css">
    <link class="icon" type="image/png" href="gem192.png">
    <link rel="manifest" href="./manifest.json">

    <script>
    if ('serviceWorker' in navigator) {
      const savedVersion = localStorage.getItem('app-debug-version');
      if (savedVersion) {
        window.addEventListener('DOMContentLoaded', () => {
          document.getElementById('debug-version').innerText = savedVersion;
        });
      }

      navigator.serviceWorker.register('./sw.js?update=' + Date.now())
        .then((registration) => {
          const statusEl = document.getElementById('debug-status');
          if (!statusEl) return;
          if (registration.installing) {
            statusEl.innerText = "Downloading...";
            statusEl.style.color = "#33b5e5";
          } else if (registration.waiting) {
            statusEl.innerText = "Update Ready";
            statusEl.style.color = "#ffbb33";
          } else if (registration.active) {
            statusEl.innerText = "Running";
            statusEl.style.color = "#00C851";
          }
        })
        .catch(() => {
          const statusEl = document.getElementById('debug-status');
          if (statusEl) {
            statusEl.innerText = "Error";
            statusEl.style.color = "#ff4444";
          }
        });

      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'VERSION_UPDATE') {
          document.getElementById('debug-version').innerText = event.data.version;
          localStorage.setItem('app-debug-version', event.data.version);
          const statusEl = document.getElementById('debug-status');
          statusEl.innerText = "Updated Live!";
          statusEl.style.color = "#00ff00";
        }
      });
    }

    // Device & Mode Detection
    window.addEventListener('DOMContentLoaded', () => {
      const ua = navigator.userAgent;
      let os = "Unknown OS";
      if (/android/i.test(ua)) os = "Android";
      else if (/iPad|iPhone|iPod/.test(ua)) os = "iOS";
      else if (/Win/.test(ua)) os = "Windows";
      else if (/Mac/.test(ua)) os = "MacOS";

      const isApp = window.matchMedia('(display-mode: standalone)').matches;
      const mode = isApp ? "Installed App" : "Browser";
      const deviceEl = document.getElementById('debug-device');
      if (deviceEl) deviceEl.innerText = `${os} (${mode})`;
    });
    </script>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo" onclick="resetFilters()">
                <img src="gem192.png" alt="Daelan's Diamond" class="logo-icon">
                <div class="logo-text">
                    <span class="logo-name">Daelan's</span>
                    <span class="logo-tag">Downloadable Items</span>
                </div>
            </a>

            <div class="nav-links">
                <a href="#" class="nav-link active" onclick="resetFilters()">Home</a>
                <a href="#" class="nav-link" onclick="alert('Server uploads are locked for release builds.')">Upload</a>
            </div>

            <div class="nav-actions">
                <!-- Categories Wrapper -->
                <div class="dropdown-wrapper">
                    <button class="categories-btn" id="categories-toggle-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                        Categories
                    </button>
                    <!-- Categories Dropdown Menu -->
                    <div class="categories-menu" id="categories-menu">
                        <div class="cat-group">
                            <span class="cat-heading">Source Type</span>
                            <button onclick="filterBySource('all')">All Sources</button>
                            <button onclick="filterBySource('Local')">Local (Offline Ready)</button>
                            <button onclick="filterBySource('Server')">Server (Wi-Fi / Data)</button>
                        </div>
                        <div class="cat-divider"></div>
                        <div class="cat-group">
                            <span class="cat-heading">File Types</span>
                            <button onclick="filterByFileType('all')">All File Types</button>
                            <button onclick="filterByFileType('Media')">Media</button>
                            <button onclick="filterByFileType('Documents')">Documents</button>
                            <button onclick="filterByFileType('Programming')">Programming</button>
                            <button onclick="filterByFileType('Text')">Text</button>
                            <button onclick="filterByFileType('Programs')">Programs</button>
                            <button onclick="filterByFileType('Archives')">Archives</button>
                        </div>
                    </div>
                </div>

                <button class="my-downloads-btn" id="open-mydownloads-btn">My Downloads</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero-title">Daelan's<br>Downloadable Items</h1>
        <div class="search-bar">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" placeholder="Search for Downloadable Items" id="search-input">
        </div>
        <div id="active-filter-bar" class="active-filter-bar" style="display: none;">
            <span id="filter-label">Showing: All</span>
            <button onclick="resetFilters()">Clear Filter ✕</button>
        </div>
        <button id="install-app-btn" style="display: none; margin-top: 16px; padding:12px 20px; font-size:16px;">
          Install Daelan's Downloads App
        </button>
    </section>

    <!-- Items Grid -->
    <section class="items-section">
        <div class="grid-container" id="items-grid">
            <!-- Items loaded by script.js -->
        </div>
    </section>

    <!-- My Downloads Modal -->
    <div id="mydownloads-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h2>My Downloads</h2>
                <button class="close-modal-btn" id="close-mydownloads-btn">✕</button>
            </div>
            <div class="modal-tabs">
                <button class="tab-btn active" id="tab-downloads" onclick="switchModalTab('downloads')">Downloads History</button>
                <button class="tab-btn" id="tab-locals" onclick="switchModalTab('locals')">Saved Locals (Offline)</button>
            </div>
            <div class="modal-body" id="modal-list-container">
                <!-- Populated dynamically by script.js -->
            </div>
        </div>
    </div>

    <!-- Floating Debug Info Panel -->
    <div id="debug-panel">
        [DEBUG] Status: <span id="debug-status" style="color: #ff9900;">Checking...</span><br>
        [DEBUG] Version: <span id="debug-version" style="color: #fff;">v1.2.1 (Loaded)</span><br>
        [DEBUG] Device: <span id="debug-device" style="color: #00d8ff;">Detecting...</span>
    </div>

<script>
let deferredInstallPrompt = null;
const installButton = document.getElementById('install-app-btn');

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  installButton.style.display = 'block';
});

installButton.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installButton.style.display = 'none';
});
</script>
<script src="script.js"></script>
</body>
</html>
