<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daelan's Downloadable Items</title>
    <link rel="stylesheet" href="style.css">
    <link class="icon" type="image/png" href="gem192.png">
    <link rel="manifest" href="./manifest.json">

    <script>
    if ('serviceWorker' in navigator) {
      // 1. Show last saved version immediately while checking
      const savedVersion = localStorage.getItem('app-debug-version');
      if (savedVersion) {
        window.addEventListener('DOMContentLoaded', () => {
          const verEl = document.getElementById('debug-version');
          if (verEl) verEl.innerText = savedVersion;
        });
      }

      // Helper to ask the active Service Worker for its exact CACHE_NAME
      function syncVersionFromSW(worker) {
        if (!worker) return;
        worker.postMessage({ type: 'GET_VERSION' });
      }

      // 2. Register Service Worker and track state changes live
      navigator.serviceWorker.register('./sw.js?update=' + Date.now())
        .then((registration) => {
          const statusEl = document.getElementById('debug-status');

          if (registration.active) {
            if (statusEl) {
              statusEl.innerText = "Running";
              statusEl.style.color = "#00C851";
            }
            syncVersionFromSW(registration.active);
          }

          // Listen for new updates installing in the background
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (!newWorker) return;

            if (statusEl) {
              statusEl.innerText = "Downloading...";
              statusEl.style.color = "#33b5e5";
            }

            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'activated') {
                if (statusEl) {
                  statusEl.innerText = "Updated Live!";
                  statusEl.style.color = "#00ff00";
                }
                syncVersionFromSW(newWorker);
              }
            });
          });
        })
        .catch(() => {
          const statusEl = document.getElementById('debug-status');
          if (statusEl) {
            statusEl.innerText = "Error";
            statusEl.style.color = "#ff4444";
          }
        });

      // 3. Receive version reply from sw.js and lock it in localStorage
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'VERSION_UPDATE') {
          const verEl = document.getElementById('debug-version');
          if (verEl) verEl.innerText = event.data.version;
          localStorage.setItem('app-debug-version', event.data.version);
        }
      });
    }

    // Device & Mode Detection
    window.addEventListener('DOMContentLoaded', () => {
      const ua = navigator.userAgent;
      let os = "Unknown OS";
      if (/android/i.test(ua)) os = "Android";
      else if (/iPad|iPhone|iPod/.test(ua)) os = "iOS";
      else if (/Win/.test(ua)) os = "Windows";
      else if (/Mac/.test(ua)) os = "MacOS";

      const isApp = window.matchMedia('(display-mode: standalone)').matches || !!window.cordova || /; wv\)/.test(ua);
      const mode = isApp ? "Installed App" : "Browser";
      const deviceEl = document.getElementById('debug-device');
      if (deviceEl) deviceEl.innerText = `${os} (${mode})`;
    });
    </script>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo" onclick="resetFilters()">
                <img src="gem192.png" alt="Daelan's Diamond" class="logo-icon">
                <div class="logo-text">
                    <span class="logo-name">Daelan's</span>
                    <span class="logo-tag">Downloadable Items</span>
                </div>
            </a>

            <div class="nav-links">
                <a href="#" class="nav-link active" onclick="resetFilters()">Home</a>
                <a href="#" class="nav-link" onclick="alert('Server uploads are locked for release builds.')">Upload</a>
            </div>

            <div class="nav-actions">
                <!-- Categories Wrapper -->
                <div class="dropdown-wrapper">
                    <button class="categories-btn" id="categories-toggle-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                        Categories
                    </button>
                    <!-- Categories Dropdown Menu -->
                    <div class="categories-menu" id="categories-menu">
                        <div class="cat-group">
                            <span class="cat-heading">Source Type</span>
                            <button onclick="filterBySource('all')">All Sources</button>
                            <button onclick="filterBySource('Local')">Local (Offline Ready)</button>
                            <button onclick="filterBySource('Server')">Server (Wi-Fi / Data)</button>
                        </div>
                        <div class="cat-divider"></div>
                        <div class="cat-group">
                            <span class="cat-heading">File Types</span>
                            <button onclick="filterByFileType('all')">All File Types</button>
                            <button onclick="filterByFileType('Media')">Media</button>
                            <button onclick="filterByFileType('Documents')">Documents</button>
                            <button onclick="filterByFileType('Programming')">Programming</button>
                            <button onclick="filterByFileType('Text')">Text</button>
                            <button onclick="filterByFileType('Programs')">Programs</button>
                            <button onclick="filterByFileType('Archives')">Archives</button>
                        </div>
                    </div>
                </div>

                <button class="my-downloads-btn" id="open-mydownloads-btn">My Downloads</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero-title">Daelan's<br>Downloadable Items</h1>
        <div class="search-bar">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" placeholder="Search for Downloadable Items" id="search-input">
        </div>
        <div id="active-filter-bar" class="active-filter-bar" style="display: none;">
            <span id="filter-label">Showing: All</span>
            <button onclick="resetFilters()">Clear Filter ✕</button>
        </div>
        <button id="install-app-btn" style="display: none; margin-top: 16px; padding:12px 20px; font-size:16px;">
          Install Daelan's Downloads App
        </button>
        <div id="app-quick-actions" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:16px 0 24px;">
  <!-- Refresh: Hidden before install, appears ONLY when installed (APK / PWA / IPK) -->
  <button id="btn-installed-refresh" type="button" onclick="customRefreshApp(this)" style="display:none; align-items:center; gap:6px; padding:7px 14px; font-size:12px; font-weight:600; color:#E2E8F0; background:#1E293B; border:1px solid rgba(255,255,255,0.15); border-radius:8px; cursor:pointer;">
    <span class="btn-icon" style="display:inline-flex; width:15px; height:15px; transition:transform 0.5s ease;">
      <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:100%; height:100%;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
    </span>
    <span>Refresh</span>
  </button>

  <!-- Clear Cache: Always visible on BOTH website and installed apps -->
  <button id="btn-clear-cache" type="button" onclick="customClearAppCache()" style="display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-size:12px; font-weight:600; color:#FCA5A5; background:#1E293B; border:1px solid rgba(248,113,113,0.3); border-radius:8px; cursor:pointer;">
    <span class="btn-icon" style="display:inline-flex; width:15px; height:15px;">
      <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="currentColor" style="width:100%; height:100%;">
        <path fill-rule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clip-rule="evenodd" />
      </svg>
    </span>
    <span>Clear Cache</span>
  </button>

  <!-- Updates: Always visible across Website, APK, and future IPK -->
  <a id="btn-app-updates" href="https://github.com" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-size:12px; font-weight:600; color:#38BDF8; background:#1E293B; border:1px solid rgba(56,189,248,0.35); border-radius:8px; text-decoration:none;">
    <span class="btn-icon" style="display:inline-flex; width:15px; height:15px;">
      <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:100%; height:100%;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
      </svg>
    </span>
    <span>Updates</span>
  </a>

  <script>
    (function setupInstallStateButtons() {
      const refreshBtn = document.getElementById('btn-installed-refresh');
      if (!refreshBtn) return;

      const isCordovaOrWebView = !!(
        window.cordova ||
        window.PhoneGap ||
        window.phonegap ||
        /; wv\)/i.test(navigator.userAgent) ||
        (document.URL.indexOf('http://') === -1 && document.URL.indexOf('https://') === -1)
      );
      const isStandalonePWA =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      if (isCordovaOrWebView || isStandalonePWA) {
        refreshBtn.style.display = 'inline-flex';
      }

      window.addEventListener('beforeinstallprompt', () => {
        if (!isCordovaOrWebView && !isStandalonePWA) {
          refreshBtn.style.display = 'none';
        }
      });

      window.addEventListener('appinstalled', () => {
        refreshBtn.style.display = 'inline-flex';
      });
    })();

    async function customRefreshApp(btn) {
      if (btn) {
        btn.disabled = true;
        const icon = btn.querySelector('.btn-icon');
        const label = btn.querySelector('span:last-child');
        if (icon) icon.style.transform = 'rotate(360deg)';
        if (label) label.textContent = 'Refreshing...';
      }

      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.getRegistration();
          if (reg) await reg.update();
        }
      } catch (e) {
        console.warn('SW update check skipped:', e);
      }

      setTimeout(() => {
        window.location.reload();
      }, 300);
    }

    async function customClearAppCache() {
      if (!confirm('Clear cached app files and reload latest version? (Your saved Local items stay safe)')) return;
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(
          keys.filter(k => k !== 'daelan-offline-locals-v1').map(k => caches.delete(k))
        );
      }
      window.location.reload();
    }
  </script>
        </div>
    </section>

    <!-- Items Grid -->
    <section class="items-section">
        <div class="grid-container" id="items-grid">
            <!-- Items loaded by script.js -->
        </div>
    </section>

    <!-- My Downloads Modal -->
    <div id="mydownloads-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h2>My Downloads</h2>
                <button class="close-modal-btn" id="close-mydownloads-btn">✕</button>
            </div>
            <div class="modal-tabs">
                <button class="tab-btn active" id="tab-downloads" onclick="switchModalTab('downloads')">Downloads History</button>
                <button class="tab-btn" id="tab-locals" onclick="switchModalTab('locals')">Saved Locals (Offline)</button>
            </div>
            <div class="modal-body" id="modal-list-container">
                <!-- Populated dynamically by script.js -->
            </div>
        </div>
    </div>

    <!-- Floating Debug Info Panel -->
    <div id="debug-panel">
        [DEBUG] Status: <span id="debug-status" style="color: #ff9900;">Checking...</span><br>
        [DEBUG] Version: <span id="debug-version" style="color: #fff;">v1.3.9.3</span><br>
        [DEBUG] Device: <span id="debug-device" style="color: #00d8ff;">Detecting...</span>
    </div>

<script>
let deferredInstallPrompt = null;
const installButton = document.getElementById('install-app-btn');

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  installButton.style.display = 'block';
});

installButton.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installButton.style.display = 'none';
});
</script>
<script src="script.js"></script>
<script src="loader-hook.js"></script>
</body>
</html>
