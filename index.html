<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daelan's Downloadable Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="gem192.png">

    <!-- PWA Manifest & Service Worker -->
    <link rel="manifest" href="./manifest.json">
    <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .catch(err => console.error("Service worker failed:", err));
    }
    </script>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <!-- Replaced old SVG with your gem image tag -->
                <img src="your-gem-image.png" alt="Gem Logo" class="logo-icon">
                <div class="logo-text">
                    <span class="logo-name">Daelan's</span>
                    <span class="logo-tag">Downloadable Website</span>
                </div>
            </a>

            <div class="nav-links">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Upload</a>
            </div>

            <div class="nav-actions">
                <button class="categories-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    Categories
                </button>
                <button class="my-downloads-btn">My Downloads</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero-title">Creating Things for<br>Everyone to Download</h1>
        <div class="search-bar">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" placeholder="Search for Downloadable Items" id="search-input">
        </div>
        <!-- PWA Install Button -->
        <button id="install-app-btn" style="display: none; margin-top: 16px; padding:12px 20px; font-size:16px;">
          Install Daelan's Downloads App
        </button>
    </section>

    <!-- Items Grid -->
    <section class="items-section">
        <div class="grid-container" id="items-grid">
            <!-- Items loaded by JavaScript -->
        </div>
    </section>

<script>
let deferredInstallPrompt = null;
const installButton = document.getElementById('install-app-btn');

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  installButton.style.display = 'block';
});

installButton.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  const result = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installButton.style.display = 'none';
});
</script>
</body>
<script src="script.js"></script>
</html>
