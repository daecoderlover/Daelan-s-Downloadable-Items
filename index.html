<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="og6FeBb6OchdvgFyNtK5Zou97V8IQocQrxjziH6Pafs" />

    <!-- Hides site from public Google search results -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Daelan's Downloadable Items</title>
    <link rel="stylesheet" href="style.css">
    <link class="icon" type="image/png" href="gem192.png">

    <!-- PWA Manifest & Service Worker Setup with Debug Hook -->
    <link rel="manifest" href="./manifest.json">
    <script>
    if ('serviceWorker' in navigator) {
      // 1. Instantly check if we have a saved version from a previous update before rendering
      const savedVersion = localStorage.getItem('app-debug-version');
      if (savedVersion) {
        window.addEventListener('DOMContentLoaded', () => {
          document.getElementById('debug-version').innerText = savedVersion;
        });
      }

      // 2. Register your Service Worker (Bypasses GitHub Cache)
      navigator.serviceWorker.register('./sw.js?update=' + Date.now())
        .then((registration) => {
          const statusEl = document.getElementById('debug-status');
          if (!statusEl) return;
          
          if (registration.installing) {
            statusEl.innerText = "Downloading...";
            statusEl.style.color = "#33b5e5";
          } else if (registration.waiting) {
            statusEl.innerText = "Update Ready";
            statusEl.style.color = "#ffbb33";
          } else if (registration.active) {
            // Clears "Checking..." and stably displays Running alongside your saved version string
            statusEl.innerText = "Running";
            statusEl.style.color = "#00C851";
          }
        })
        .catch(err => {
          console.error("Service worker failed:", err);
          const statusEl = document.getElementById('debug-status');
          if (statusEl) {
            statusEl.innerText = "Error";
            statusEl.style.color = "#ff4444";
          }
        });

      // 3. Catch the live update message from sw.js
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'VERSION_UPDATE') {
          // Update the display text right now
          document.getElementById('debug-version').innerText = event.data.version;
          
          // Save it to local storage so it stays when refreshed!
          localStorage.setItem('app-debug-version', event.data.version);
          
          // Flash status green to indicate update complete
          const statusEl = document.getElementById('debug-status');
          statusEl.innerText = "Updated Live!";
          statusEl.style.color = "#00ff00";
        }
      });
    }
    </script>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <img src="gem192.png" alt="Daelan's Diamond" class="logo-icon">
                <div class="logo-text">
                    <span class="logo-name">Daelan's</span>
                    <span class="logo-tag">Downloadable Items</span>
                </div>
            </a>

            <div class="nav-links">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Upload</a>
            </div>

            <div class="nav-actions">
                <button class="categories-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    Categories
                </button>
                <button class="my-downloads-btn">My Downloads</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero-title">Daelan's<br>Downloadable Items</h1>
        <div class="search-bar">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" placeholder="Search for Downloadable Items" id="search-input">
        </div>
        <!-- PWA Install Button -->
        <button id="install-app-btn" style="display: none; margin-top: 16px; padding:12px 20px; font-size:16px;">
          Install Daelan's Downloads App
        </button>
    </section>

    <!-- Items Grid -->
    <section class="items-section">
        <div class="grid-container" id="items-grid">
            <!-- Items loaded by JavaScript -->
        </div>
    </section>

    <!-- Floating Debug Info Panel -->
    <div id="debug-panel" style="position: fixed; bottom: 10px; right: 10px; background: rgba(0, 0, 0, 0.85); color: #00ff00; font-family: monospace; font-size: 11px; padding: 8px 12px; border-radius: 5px; border: 1px solid #333; z-index: 9999; pointer-events: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
        [DEBUG] Status: <span id="debug-status" style="color: #ff9900;">Checking...</span><br>
        [DEBUG] Version: <span id="debug-version" style="color: #fff;">v1.2.1 (Loaded)</span>
    </div>

<script>
let deferredInstallPrompt = null;
const installButton = document.getElementById('install-app-btn');

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  installButton.style.display = 'block';
});

installButton.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  const result = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installButton.style.display = 'none';
});
</script>
</body>
<script src="script.js"></script>
</html>
